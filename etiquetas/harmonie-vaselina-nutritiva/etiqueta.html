<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Etiqueta Vaselina Nutritiva</title>
<!--
  Harmonie · Vaselina nutritiva — etiqueta de 6 x 2.5 in.
  Se diseña a 1920 x 800 px (320 ppi). La variante se elige con el hash: #sin-fragancia o #batana.
  render.js la exporta a PNG (320 ppi) y a PDF vectorial de 6 x 2.5 in.
-->
<link rel="stylesheet" href="comun.css">
<style>

  @page { size: 6in 2.5in; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 800px; overflow: hidden; background: #fff; }

  #label {
    position: relative; width: 1920px; height: 800px; overflow: hidden;
    background:
      radial-gradient(ellipse 760px 520px at 960px 400px, var(--bg-in) 0%, var(--bg-mid) 55%, transparent 100%),
      radial-gradient(ellipse 1300px 700px at 960px 400px, var(--bg-mid) 30%, var(--bg-out) 100%);
    font-family: 'PT Serif', serif; color: var(--ink);
  }
  svg.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 800px; }

  /* ---- side panels ---------------------------------------------------------------------- */
  .panel { position: absolute; top: 74px; }
  .panel.left { left: 56px; width: 540px; }
  .panel.right { left: 1324px; width: 540px; }

  .pill {
    display: inline-flex; align-items: center; gap: 14px; height: 52px; padding: 0 30px 0 8px;
    border-radius: 26px; background: linear-gradient(180deg, var(--pill-a), var(--pill-b));
    box-shadow: 0 0 0 2.5px #d9ae55, 0 0 0 4px rgba(122, 78, 14, .35), 0 3px 8px rgba(60, 30, 0, .18);
    font-size: 31px; color: var(--pill-ink); letter-spacing: .2px;
  }
  .pill .ico {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #fff9e6, #efd391 60%, #c8963c);
  }
  .pill .ico svg { width: 26px; height: 26px; }
  .body { margin-top: 14px; font-size: 24.5px; line-height: 1.32; text-align: justify; hyphens: none;
          text-align-last: left; text-wrap: pretty; color: var(--ink); }
  .divider { height: 26px; margin: 16px 0 14px; }

  .free { display: flex; gap: 16px; margin-top: 24px; }
  .free svg { width: 92px; height: 92px; }

  .fecha { display: flex; align-items: center; gap: 14px; margin-top: 18px; font-size: 22px; color: var(--ink); }
  .fecha svg { width: 44px; height: 46px; flex: none; }
  .fecha .line { width: 170px; border-bottom: 2px dotted var(--accent); height: 24px; margin-left: 4px; }

  .beneficios { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; text-align: center; }
  .beneficios .b svg { width: 78px; height: 78px; display: block; margin: 0 auto 6px; }
  .beneficios .b span { font-size: 18.5px; line-height: 1.15; display: block; color: var(--ink); }

  .uso { display: flex; align-items: center; gap: 14px; margin-top: 4px; font-size: 21px; line-height: 1.25; }
  .uso svg { width: 30px; height: 60px; flex: none; }
  .uso b { font-weight: 700; }

  .social { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 16px; }
  .social .s { flex: none; }
  .handle { flex: 1; position: relative; height: 92px; margin: 0 0 18px; }
  .handle svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .social .s { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 150px; }
  .social .tag {
    display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 20px 0 12px; border-radius: 20px;
    background: linear-gradient(180deg, var(--pill-a), var(--pill-b)); color: var(--pill-ink); font-size: 21px;
    box-shadow: 0 0 0 2px #d9ae55, 0 2px 5px rgba(60, 30, 0, .15);
  }
  .social .tag svg { width: 24px; height: 24px; }
  .social .card { width: 128px; height: 128px; padding: 9px; background: var(--qr-card); border-radius: 8px;
                  box-shadow: 0 0 0 2px #d9ae55, 0 2px 6px rgba(60, 30, 0, .18); }
  .social .card img { width: 110px; height: 110px; display: block; image-rendering: pixelated; }

  /* ---- centre ------------------------------------------------------------------------- */
  .logo { position: absolute; left: 960px; top: 34px; width: 430px; transform: translateX(-50%); }
  .titulo {
    position: absolute; left: 0; width: 1920px; top: 286px; text-align: center;
    font-family: 'Cinzel'; font-weight: 800; font-size: 84px; letter-spacing: 3px; line-height: 1;
  }
  .sub {
    position: absolute; left: 0; width: 1920px; top: 382px; display: flex; justify-content: center; align-items: center; gap: 18px;
    font-family: 'Cinzel'; font-weight: 700; font-size: 31px; letter-spacing: 11px; color: var(--accent-dark);
  }
  .sub i { display: block; width: 74px; height: 2px; background: linear-gradient(90deg, transparent, #c8963c, transparent); }
  .tagline {
    position: absolute; left: 0; width: 1920px; top: 520px; text-align: center; font-size: 22px; font-weight: 700;
    color: var(--accent-dark); letter-spacing: .5px;
  }
  .tagline em { font-style: normal; color: #c8963c; margin: 0 10px; }
</style>
</head>
<body>
<div id="label">
  <svg class="layer" id="back" viewBox="0 0 1920 800"></svg>

  <!-- left panel -->
  <div class="panel left">
    <div class="pill"><span class="ico"><svg viewBox="0 0 24 24"><path d="M5 19c1-7 5-12 14-14-1 9-6 13-12 13" fill="none" stroke="var(--pill-icon)" stroke-width="2.2" stroke-linecap="round"/><path d="M5 19c3-4 6-7 10-10" fill="none" stroke="var(--pill-icon)" stroke-width="2" stroke-linecap="round"/></svg></span>Propiedades</div>
    <p class="body" id="propiedades"></p>
    <svg class="divider" viewBox="0 0 556 26" data-divider></svg>
    <div class="pill"><span class="ico"><svg viewBox="0 0 24 24"><path d="M5 19c1-7 5-12 14-14-1 9-6 13-12 13" fill="none" stroke="var(--pill-icon)" stroke-width="2.2" stroke-linecap="round"/><path d="M5 19c3-4 6-7 10-10" fill="none" stroke="var(--pill-icon)" stroke-width="2" stroke-linecap="round"/></svg></span>Ingredientes</div>
    <p class="body" id="ingredientes"></p>
    <div class="free" id="free"></div>
    <div class="fecha">
      <svg viewBox="0 0 44 46"><g fill="none" stroke="var(--accent-dark)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="38" height="35" rx="6"/><path d="M3 18h38" /><path d="M13 3v9M31 3v9"/><path d="M13 30l6 6 12-12"/></g></svg>
      <span>Fecha de caducidad:</span><span class="line"></span>
    </div>
  </div>

  <!-- right panel -->
  <div class="panel right">
    <div class="pill"><span class="ico"><svg viewBox="0 0 24 24"><g fill="none" stroke="var(--pill-icon)" stroke-width="2.1"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.9 1.9M16.6 16.6l1.9 1.9M5.5 18.5l1.9-1.9M16.6 7.4l1.9-1.9"/><circle cx="12" cy="12" r="6.6"/></g></svg></span>Modo de uso</div>
    <p class="body" id="modo" style="font-size: 27px" data-range="2"></p>
    <svg class="divider" viewBox="0 0 556 26" data-divider></svg>
    <div class="beneficios" id="beneficios"></div>
    <svg class="divider" viewBox="0 0 556 26" data-divider></svg>
    <div class="uso">
      <svg viewBox="0 0 30 60"><g fill="none" stroke="var(--accent-dark)" stroke-width="3"><path d="M10 40V8a5 5 0 0 1 10 0v32a9 9 0 1 1-10 0z"/></g><circle cx="15" cy="47" r="5" fill="var(--accent-dark)"/><path d="M15 44V20" stroke="var(--accent-dark)" stroke-width="3.4" stroke-linecap="round"/></svg>
      <div><b>Uso externo.</b><br>No someter a calor extremo.</div>
    </div>
    <div class="social">
      <div class="s">
        <span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor"/></svg>Instagram</span>
        <div class="card"><img src="assets/qr-instagram.svg" alt=""></div>
      </div>
      <div class="handle"><svg id="handle" viewBox="0 0 240 92"></svg></div>
      <div class="s">
        <span class="tag"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 2h3.1c.3 2.3 1.7 3.9 4 4.2v3.2c-1.5 0-2.9-.4-4-1.2v6.9a6.3 6.3 0 1 1-6.3-6.3c.4 0 .7 0 1 .1v3.3a3.1 3.1 0 1 0 2.2 3V2z"/></svg>TikTok</span>
        <div class="card"><img src="assets/qr-tiktok.svg" alt=""></div>
      </div>
    </div>
  </div>

  <!-- centre -->
  <svg class="layer" id="front" viewBox="0 0 1920 800"></svg>
  <img class="logo" src="assets/logo-harmonie.png" alt="Harmonie">
  <div class="titulo"><svg width="1920" height="100" viewBox="0 0 1920 100" id="titulo"></svg></div>
  <div class="sub"><i></i><span>NUTRITIVA</span><i></i></div>
  <div class="tagline" id="tagline"></div>
  <svg class="layer" id="top" viewBox="0 0 1920 800"></svg>
</div>

<script src="comun.js"></script>
<script>
const key = (location.hash || '#sin-fragancia').slice(1);
const V = VARIANTES[key];
document.getElementById('label').className = key;
document.getElementById('propiedades').textContent = V.propiedades;
document.getElementById('ingredientes').textContent = V.ingredientes;
document.getElementById('modo').textContent = MODO;
document.getElementById('tagline').innerHTML = 'Nutre<em>•</em>Suaviza<em>•</em>Da brillo';

// ---- back layer: corner foliage, gold edge rules ------------------------------------------
const back = document.getElementById('back');
const B = defs(back, 'b');
(function () {
  const g = el(back, 'g');
  // sprays hugging the oval, top and bottom
  for (const side of [-1, 1]) {
    branch(g, B, { x: 960 + side * 150, y: -20, ang: side < 0 ? 200 : -20, len: 260, n: 5, size: 58, bend: .18, flip: side, gold: true });
    branch(g, B, { x: 960 + side * 120, y: 820, ang: side < 0 ? 160 : 20, len: 280, n: 5, size: 60, bend: -.18, flip: side, gold: true });
  }
  for (const [x, y, r] of [[300, 50, 9], [1640, 52, 10], [640, 112, 7], [1290, 40, 8], [610, 770, 8], [1330, 770, 9]])
    sparkle(g, x, y, r, B, .85);
  // gold rules flush with the top and bottom edges, as on the oil labels
  for (const y of [0, 794]) el(g, 'rect', { x: 0, y, width: 1920, height: 6, fill: `url(#gold${B})` });
})();

// ---- front layer: oval, ribbon, drop, family seal ---------------------------------------
const front = document.getElementById('front');
const F = defs(front, 'f');
(function () {
  const g = el(front, 'g');
  const CX = 960, CY = 400, RX = 298, RY = 386;
  el(g, 'ellipse', { cx: CX, cy: CY, rx: RX + 40, ry: RY + 20, fill: `url(#glow${F})` });
  el(g, 'ellipse', { cx: CX, cy: CY, rx: RX, ry: RY, fill: `url(#oval${F})`, filter: `url(#shadow${F})` });
  el(g, 'ellipse', { cx: CX, cy: CY, rx: RX, ry: RY, fill: 'none', stroke: `url(#gold${F})`, 'stroke-width': 9 });
  el(g, 'ellipse', { cx: CX, cy: CY, rx: RX - 16, ry: RY - 16, fill: 'none', stroke: `url(#gold${F})`, 'stroke-width': 2.5 });
  // little gold sprigs inside the oval, either side of the logo
  for (const side of [-1, 1])
    branch(g, F, { x: CX + side * 236, y: 290, ang: side < 0 ? -78 : -102, len: 170, n: 5, size: 34, bend: .12, flip: side, gold: true });
  for (const [x, y, r] of [[CX - 170, 70, 11], [CX + 190, 96, 9], [CX + 140, 180, 6], [CX - 210, 160, 6], [CX + 222, 560, 7], [CX - 228, 548, 7]])
    sparkle(g, x, y, r, F);
})();

// title in gold
(function () {
  const t = document.getElementById('titulo');
  defs(t, 't');
  el(t, 'text', { x: 960, y: 84, 'text-anchor': 'middle', 'font-family': 'Cinzel', 'font-weight': 800, 'font-size': 84,
                  'letter-spacing': 3, fill: '#5a3608', opacity: .35, transform: 'translate(2,3)' }, 'VASELINA');
  el(t, 'text', { x: 960, y: 84, 'text-anchor': 'middle', 'font-family': 'Cinzel', 'font-weight': 800, 'font-size': 84,
                  'letter-spacing': 3, fill: 'url(#goldVt)', stroke: '#8a5a12', 'stroke-width': 1.2 }, 'VASELINA');
})();

const top_ = document.getElementById('top');
const T = defs(top_, 'tp');
(function () {
  const g = el(top_, 'g');
  // ribbon: a gentle arc whose folded tails tuck behind it
  const y = 436, x0 = 680, x1 = 1240, sag = 18, h = 62;
  const tail = (dir) => {
    const xe = dir < 0 ? x0 : x1, xo = xe + dir * 50;
    el(g, 'path', { d: `M${xe - dir * 10},${y + 14} L${xo},${y + 10} L${xo - dir * 22},${y + h / 2 + 12} L${xo},${y + h + 16} L${xe - dir * 10},${y + h + 18}Z`,
                    fill: `url(#ribbonBack${T})`, stroke: `url(#gold${T})`, 'stroke-width': 2 });
  };
  tail(-1); tail(1);
  const top = `M${x0},${y} Q960,${y + sag * 2} ${x1},${y}`;
  const bot = `L${x1},${y + h} Q960,${y + h + sag * 2} ${x0},${y + h}Z`;
  el(g, 'path', { d: top + bot, fill: `url(#ribbon${T})`, stroke: `url(#gold${T})`, 'stroke-width': 3.5, filter: `url(#shadow${T})` });
  el(g, 'path', { id: 'rib', d: `M${x0},${y + h * .66} Q960,${y + h * .66 + sag * 2} ${x1},${y + h * .66}`, fill: 'none' });
  const tx = el(g, 'text', { 'font-family': 'PT Serif', 'font-size': V.cinta.length > 16 ? 33 : 37, 'font-weight': 700,
                              fill: css('--ribbon-ink'), 'letter-spacing': 1 });
  el(tx, 'textPath', { href: '#rib', startOffset: '50%', 'text-anchor': 'middle' }, V.cinta);

  // the drop of oil between two leafy sprigs
  const DX = 960, DY = 662;
  for (const side of [-1, 1]) {
    branch(g, T, { x: DX + side * 18, y: DY + 96, ang: side < 0 ? 196 : -16, len: 150, n: 4, size: 50, bend: .25, flip: -side });
    branch(g, T, { x: DX + side * 10, y: DY + 100, ang: side < 0 ? 228 : -48, len: 110, n: 3, size: 40, bend: .2, flip: side, gold: true });
  }
  const drop = `M${DX},${DY - 104} C${DX + 22},${DY - 58} ${DX + 64},${DY - 12} ${DX + 64},${DY + 34}
                A64,64 0 1 1 ${DX - 64},${DY + 34} C${DX - 64},${DY - 12} ${DX - 22},${DY - 58} ${DX},${DY - 104}Z`;
  el(g, 'path', { d: drop, fill: `url(#drop${T})`, stroke: css('--drop-edge'), 'stroke-width': 2.5, filter: `url(#shadow${T})` });
  el(g, 'path', { d: `M${DX - 30},${DY + 6} C${DX - 34},${DY + 30} ${DX - 24},${DY + 56} ${DX - 2},${DY + 70}`,
                  fill: 'none', stroke: '#fff', 'stroke-width': 9, 'stroke-linecap': 'round', opacity: .75 });
  el(g, 'ellipse', { cx: DX - 18, cy: DY - 30, rx: 8, ry: 16, fill: '#fff', opacity: .8, transform: `rotate(28 ${DX - 18} ${DY - 30})` });
  sparkle(g, DX + 36, DY - 40, 12, T);

  // "Para toda la familia" seal, overlapping the oval's lower-left edge
  const SX = 712, SY = 636, R = 96;
  const sg = el(g, 'g', { filter: `url(#shadow${T})` });
  const scallop = [];
  for (let i = 0; i < 48; i++) {
    const a0 = i / 48 * Math.PI * 2, a1 = (i + .5) / 48 * Math.PI * 2;
    scallop.push(`${i ? 'L' : 'M'}${SX + Math.cos(a0) * (R + 10)},${SY + Math.sin(a0) * (R + 10)}`,
                 `L${SX + Math.cos(a1) * (R + 4)},${SY + Math.sin(a1) * (R + 4)}`);
  }
  el(sg, 'path', { d: scallop.join(' ') + 'Z', fill: `url(#gold${T})` });
  el(sg, 'circle', { cx: SX, cy: SY, r: R - 4, fill: `url(#seal${T})`, stroke: '#f6dc96', 'stroke-width': 2 });
  el(sg, 'circle', { cx: SX, cy: SY, r: R - 13, fill: 'none', stroke: '#e9c46a', 'stroke-width': 1.6, 'stroke-dasharray': '2 5', 'stroke-linecap': 'round' });
  el(g, 'path', { id: 'arcTop', d: `M${SX - 66},${SY + 4} A66,66 0 0 1 ${SX + 66},${SY + 4}`, fill: 'none' });
  const t1 = el(g, 'text', { 'font-family': 'Cinzel', 'font-weight': 700, 'font-size': 19, fill: '#fbe7b5', 'letter-spacing': 2.5 });
  el(t1, 'textPath', { href: '#arcTop', startOffset: '50%', 'text-anchor': 'middle' }, 'PARA TODA LA');
  // family: two adults and a child
  const fam = el(g, 'g', { fill: '#fbe7b5' });
  const person = (x, y, s) => {
    el(fam, 'circle', { cx: x, cy: y, r: 8.5 * s });
    el(fam, 'path', { d: `M${x - 13 * s},${y + 37 * s} C${x - 13 * s},${y + 16 * s} ${x - 9 * s},${y + 11 * s} ${x},${y + 11 * s} C${x + 9 * s},${y + 11 * s} ${x + 13 * s},${y + 16 * s} ${x + 13 * s},${y + 37 * s}Z` });
  };
  person(SX - 24, SY - 18, 1); person(SX + 24, SY - 18, 1); person(SX, SY - 2, .68);
  el(g, 'text', { x: SX, y: SY + 56, 'text-anchor': 'middle', 'font-family': 'Great Vibes', 'font-size': 44, fill: '#fbe7b5' }, 'Familia');
  sparkle(g, SX - 70, SY - 74, 9, T); sparkle(g, SX + 82, SY - 60, 7, T);
})();

// ---- panel ornaments: dividers, "free" seals, benefits -------------------------------------
freeSeals(document.getElementById('free'));

document.querySelectorAll('[data-divider]').forEach((s, i) => {
  const id = defs(s, 'd' + i);
  el(s, 'path', { d: 'M98,13 L248,13', stroke: `url(#gold${id})`, 'stroke-width': 2, 'stroke-linecap': 'round', opacity: .9 });
  el(s, 'path', { d: 'M308,13 L458,13', stroke: `url(#gold${id})`, 'stroke-width': 2, 'stroke-linecap': 'round', opacity: .9 });
  el(s, 'circle', { cx: 262, cy: 13, r: 3, fill: '#c8963c' });
  el(s, 'circle', { cx: 294, cy: 13, r: 3, fill: '#c8963c' });
  sparkle(s, 278, 13, 12, id);
});

beneficios(document.getElementById('beneficios'));

// (measured once the fonts are in; render.js waits on window.listo)
window.listo = document.fonts.ready.then(() => document.querySelectorAll('.body').forEach(justify));

// "Harmonieproducts" on a brush stroke, between the two codes
(function () {
  const s = document.getElementById('handle');
  const id = defs(s, 'h');
  el(s, 'path', { d: 'M6,30 C40,20 120,16 236,22 L232,70 C150,78 70,76 2,66 Z', fill: `url(#brush${id})`, filter: `url(#rough${id})` });
  el(s, 'path', { d: 'M24,26 C80,20 160,19 226,24', stroke: '#fff', 'stroke-width': 2, opacity: .18, fill: 'none', filter: `url(#rough${id})` });
  el(s, 'text', { x: 120, y: 54, 'text-anchor': 'middle', 'font-family': 'PT Serif', 'font-weight': 700, 'font-size': 21, fill: '#fbe7b5' }, 'Harmonieproducts');
  el(s, 'text', { x: 120, y: 8, 'text-anchor': 'middle', 'font-family': 'Great Vibes', 'font-size': 30, fill: css('--accent-dark') }, 'Síguenos');
})();
</script>
</body>
</html>
